<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:IB;src:url(file:///usr/share/fonts/opentype/inter/Inter-Bold.otf)}
@font-face{font-family:MO;src:url(file:///usr/share/fonts/truetype/dejavu/DejaVuSansMono-Bold.ttf)}
html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}
</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
/*TL*/
// M02 «Buz kubu»: şamlar yığılır, termometr qalxır, buz tərpənmir; 32°-də əriyir, qızılı toxum cücərir.
const T = window.TL;
const cv = document.getElementById('c'), X = cv.getContext('2d');
const W = 1080, H = 1920, G = 1460, IX = 620, IW = 300;
const GOLD = '#F7C04A', RED = '#FF5A4A', WHITE = '#F4F1EA', INK = '#0B0B0C', ICE = '120,200,255';
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, u) => a + (b - a) * u;
const ease = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
const eout = u => 1 - Math.pow(1 - u, 3);
const seg = (t, a, b) => clamp((t - a) / (b - a));
const bump = (t, c, w) => Math.exp(-Math.pow((t - c) / w, 2));
const R = k => { let x = Math.sin(k * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
function ik(ax, ay, bx, by, l1, l2, flip) { let dx = bx - ax, dy = by - ay, d = Math.min(Math.hypot(dx, dy), l1 + l2 - .01);
  let a = Math.atan2(dy, dx), c = Math.acos(clamp((l1 * l1 + d * d - l2 * l2) / (2 * l1 * d), -1, 1)), ang = a + (flip ? -c : c); return [ax + Math.cos(ang) * l1, ay + Math.sin(ang) * l1]; }
function reach(a, b, L) { let d = Math.hypot(b[0] - a[0], b[1] - a[1]); return d <= L ? b : [a[0] + (b[0] - a[0]) / d * L, a[1] + (b[1] - a[1]) / d * L]; }
function limb(p, w, col) { X.lineCap = 'round'; X.lineJoin = 'round'; X.strokeStyle = INK; X.lineWidth = w + 7; X.beginPath(); X.moveTo(...p[0]); for (let i = 1; i < p.length; i++) X.lineTo(...p[i]); X.stroke(); X.strokeStyle = col; X.lineWidth = w; X.stroke(); }
function figure(o) {
  const s = o.sc, col = WHITE, hip = [o.x, o.base - 176 * s + (o.crouch || 0) * 60 * s];
  const fL = [o.x - 34 * s, o.base], fR = [o.x + 34 * s, o.base];
  const kL = ik(hip[0] - 14 * s, hip[1], fL[0], fL[1], 90 * s, 90 * s, true), kR = ik(hip[0] + 14 * s, hip[1], fR[0], fR[1], 90 * s, 90 * s, false);
  const neck = [hip[0] + (o.lean || 0) * 40 * s, hip[1] - 160 * s];
  const shL = [neck[0] - 31 * s, neck[1] + 22 * s], shR = [neck[0] + 31 * s, neck[1] + 22 * s];
  const head = [neck[0] + (o.look || 0) * 10 * s, neck[1] - 46 * s + (o.down || 0) * 18 * s];
  const hL = reach(shL, o.hl || [shL[0] - 12 * s, hip[1] + 40 * s], 170 * s), hR = reach(shR, o.hr || [shR[0] + 12 * s, hip[1] + 40 * s], 170 * s);
  const eL = ik(shL[0], shL[1], hL[0], hL[1], 85 * s, 85 * s, !!o.hl), eR = ik(shR[0], shR[1], hR[0], hR[1], 85 * s, 85 * s, !o.hr);
  limb([[hip[0] - 14 * s, hip[1]], kL, fL], 30 * s, col); limb([[hip[0] + 14 * s, hip[1]], kR, fR], 30 * s, col);
  limb([hip, neck], 52 * s, col); limb([shL, eL, hL], 25 * s, col); limb([shR, eR, hR], 25 * s, col);
  X.fillStyle = INK; X.beginPath(); X.arc(head[0], head[1], 40 * s, 0, 7); X.fill(); X.fillStyle = col; X.beginPath(); X.arc(head[0], head[1], 36 * s, 0, 7); X.fill();
  const ex = head[0] + (o.look || 0) * 12 * s, ey = head[1] - 3 * s + (o.down || 0) * 9 * s;
  X.fillStyle = '#1A1A1A'; X.beginPath(); X.arc(ex - 11 * s, ey, 4.2 * s, 0, 7); X.arc(ex + 11 * s, ey, 4.2 * s, 0, 7); X.fill();
  if (o.smile > 0) { X.strokeStyle = '#1A1A1A'; X.lineWidth = 3 * s; X.beginPath(); X.arc(ex, ey + 9 * s, 9 * s * o.smile, .15 * Math.PI, .85 * Math.PI); X.stroke(); }
}

// ---------- vəziyyət ----------
function temp(t) { let v = 24; T.steps.forEach(([a, d]) => { v = lerp(v, d, ease(seg(t, a, a + .35))) > v ? lerp(v, d, ease(seg(t, a, a + .35))) : v; }); return v; }
function nCandles(t) { return T.steps.slice(0, 7).filter(([a]) => t >= a).length; }
const CANDLE = i => { const u = (i + .5) / 7; return [IX - 260 + u * 520, G + 30 + Math.sin(u * Math.PI) * 60]; };
function meltU(t) { return ease(seg(t, T.melt[0], T.melt[1])); }

// ---------- fon ----------
function bg(t, warm) {
  let g = X.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#060B12'); g.addColorStop(.6, '#081019'); g.addColorStop(1, '#020305');
  X.fillStyle = g; X.fillRect(-200, -200, W + 400, H + 400);
  let c = X.createRadialGradient(IX, G - 180, 40, IX, G - 180, 900); c.addColorStop(0, `rgba(${ICE},${.10 * (1 - warm)})`); c.addColorStop(1, 'rgba(0,0,0,0)'); X.fillStyle = c; X.fillRect(0, 0, W, H);
  let w = X.createRadialGradient(IX, G - 100, 30, IX, G - 100, 300 + 700 * warm); w.addColorStop(0, `rgba(255,170,80,${.08 + .22 * warm})`); w.addColorStop(1, 'rgba(0,0,0,0)'); X.fillStyle = w; X.fillRect(0, 0, W, H);
  // döşəmə
  let f = X.createLinearGradient(0, G, 0, H); f.addColorStop(0, '#0E1219'); f.addColorStop(1, '#020203'); X.fillStyle = f; X.fillRect(0, G, W, H - G);
  // qar dənələri (soyuq) → isti toz
  for (let i = 0; i < 60; i++) { const x = (R(i) * W + Math.sin(t * .7 + i) * 20), y = (R(i + 40) * 1400 + t * (30 + 40 * R(i + 9))) % 1400 + 200, a = .08 + .14 * R(i + 3);
    X.fillStyle = warm > .5 ? `rgba(255,210,150,${a})` : `rgba(200,230,255,${a})`; X.beginPath(); X.arc(x, y, 1.5 + 2 * R(i + 7), 0, 7); X.fill(); }
}
function pedestal() {
  X.fillStyle = '#151A22'; X.beginPath(); X.roundRect(IX - 210, G - 92, 420, 92, 10); X.fill();
  X.fillStyle = '#1E2530'; X.fillRect(IX - 210, G - 92, 420, 10);
  X.strokeStyle = 'rgba(160,200,255,.12)'; X.lineWidth = 2; X.strokeRect(IX - 210, G - 92, 420, 92);
}
function seed(t, cx, cy, glow, sproutU) {
  // içindəki toxum: hər gün parlaqlaşır
  X.save(); X.globalCompositeOperation = 'lighter';
  let g = X.createRadialGradient(cx, cy, 2, cx, cy, 40 + 120 * glow); g.addColorStop(0, `rgba(255,200,90,${.25 + .55 * glow})`); g.addColorStop(1, 'rgba(255,140,40,0)');
  X.fillStyle = g; X.fillRect(cx - 200, cy - 200, 400, 400); X.restore();
  X.fillStyle = '#FFD27A'; X.beginPath(); X.ellipse(cx, cy, 14, 20, .3, 0, 7); X.fill();
  if (sproutU > 0) { // cücərti
    const h = 260 * eout(sproutU);
    X.strokeStyle = '#E8C468'; X.lineWidth = 9; X.lineCap = 'round'; X.shadowColor = GOLD; X.shadowBlur = 24;
    X.beginPath(); X.moveTo(cx, cy); X.bezierCurveTo(cx - 20, cy - h * .4, cx + 25, cy - h * .7, cx, cy - h); X.stroke();
    const leaf = (side, k, sz) => { if (sproutU < k) return; const u = eout(seg(sproutU, k, k + .3)), y = cy - h * (k + .15), L = sz * u;
      X.fillStyle = '#F7C04A'; X.beginPath(); X.ellipse(cx + side * L * .55, y - L * .2, L * .55, L * .22, side * -.5, 0, 7); X.fill(); };
    leaf(-1, .25, 90); leaf(1, .45, 100); leaf(-1, .65, 80); leaf(1, .8, 70);
    X.shadowBlur = 0;
  }
}
function ice(t) {
  const m = meltU(t), h = IW * (1 - m), top = G - 92 - h, x0 = IX - IW / 2 - m * 30, w = IW + m * 60;
  const glow = seg(t, 3.4, 14.2), sp = seg(t, T.sprout[0], T.sprout[1]), shake = (bump(t, 13.6, .5) * 4) * Math.sin(t * 80);
  // gölməçə
  if (m > 0) { X.fillStyle = `rgba(${ICE},${.25 * m})`; X.beginPath(); X.ellipse(IX, G - 92, 150 + 110 * m, 16 + 10 * m, 0, 0, 7); X.fill(); }
  seed(t, IX, G - 92 - 40 + 0 * m, glow, sp);
  if (h < 2) return;
  X.save(); X.translate(shake, 0);
  let g = X.createLinearGradient(x0, top, x0 + w, top + h); g.addColorStop(0, `rgba(190,235,255,.55)`); g.addColorStop(.5, `rgba(${ICE},.30)`); g.addColorStop(1, `rgba(60,140,210,.45)`);
  X.fillStyle = g; X.beginPath(); X.roundRect(x0, top, w, h, 18 * (1 - m) + 6); X.fill();
  X.strokeStyle = 'rgba(220,245,255,.75)'; X.lineWidth = 3; X.stroke();
  X.strokeStyle = 'rgba(255,255,255,.55)'; X.lineWidth = 6; X.beginPath(); X.moveTo(x0 + 26, top + 30); X.lineTo(x0 + 26, top + Math.max(40, h * .55)); X.stroke();
  X.fillStyle = 'rgba(255,255,255,.18)'; X.beginPath(); X.moveTo(x0 + 10, top + 10); X.lineTo(x0 + w * .55, top + 10); X.lineTo(x0 + 10, top + h * .45); X.closePath(); X.fill();
  // çatlar (31°-dən)
  const cr = seg(t, 13.1, 14.2); if (cr > 0 && m < .3) { X.strokeStyle = `rgba(255,255,255,${.8 * cr})`; X.lineWidth = 2.5;
    [[.5, .1, .35, .45, .55, .7], [.7, .2, .8, .5, .65, .9], [.2, .3, .35, .6, .25, .85]].forEach(c => { X.beginPath(); X.moveTo(x0 + c[0] * w, top + c[1] * h);
      X.lineTo(x0 + c[2] * w, top + lerp(c[1], c[3], cr) * h); X.lineTo(x0 + c[4] * w, top + lerp(c[1], c[5], cr) * h); X.stroke(); }); }
  X.restore();
  // damcılar
  if (m > 0 && m < 1) for (let i = 0; i < 6; i++) { const ph = (t * 2 + R(i)) % 1, dx = x0 + R(i + 5) * w; X.fillStyle = `rgba(${ICE},.7)`; X.beginPath(); X.arc(dx, top + h + ph * 60, 4, 0, 7); X.fill(); }
}
function candle(i, t, born) {
  const [x, y] = CANDLE(i), u = eout(seg(t, born, born + .3)), fl = 1 + .12 * Math.sin(t * 19 + i * 3);
  X.fillStyle = '#EDE3CC'; X.beginPath(); X.roundRect(x - 11, y - 60, 22, 60, 4); X.fill();
  X.strokeStyle = '#222'; X.lineWidth = 2; X.beginPath(); X.moveTo(x, y - 60); X.lineTo(x, y - 68); X.stroke();
  if (u <= 0) return;
  X.save(); X.globalCompositeOperation = 'lighter';
  let g = X.createRadialGradient(x, y - 80, 2, x, y - 80, 110 * u); g.addColorStop(0, 'rgba(255,190,100,.55)'); g.addColorStop(1, 'rgba(255,120,30,0)'); X.fillStyle = g; X.fillRect(x - 120, y - 200, 240, 240); X.restore();
  X.fillStyle = '#FFE6A8'; X.beginPath(); X.ellipse(x, y - 80, 7 * u, 16 * u * fl, Math.sin(t * 7 + i) * .1, 0, 7); X.fill();
  X.fillStyle = '#FFFFFF'; X.beginPath(); X.ellipse(x, y - 76, 3 * u, 7 * u, 0, 0, 7); X.fill();
}
function thermo(t) {
  const x = 880, y0 = 1080, y1 = 1400, v = temp(t), u = clamp((v - 20) / 14), hot = v >= 32;
  X.fillStyle = '#10151C'; X.strokeStyle = 'rgba(220,230,240,.5)'; X.lineWidth = 3; X.beginPath(); X.roundRect(x - 18, y0, 36, y1 - y0, 18); X.fill(); X.stroke();
  X.beginPath(); X.arc(x, y1 + 10, 30, 0, 7); X.fillStyle = hot ? GOLD : RED; X.fill(); X.stroke();
  X.fillStyle = hot ? GOLD : RED; X.fillRect(x - 9, lerp(y1, y0 + 20, u), 18, y1 - lerp(y1, y0 + 20, u) + 10);
  X.fillStyle = 'rgba(220,230,240,.6)'; X.font = '20px MO'; X.textAlign = 'right';
  [24, 28, 32].forEach(d => { const yy = lerp(y1, y0 + 20, (d - 20) / 14); X.fillRect(x - 30, yy - 1, 10, 2); X.fillText(d + '°', x - 38, yy + 7); });
}
function counter(t) {
  const v = temp(t), shown = Math.floor(v + .02), hot = shown >= 32, a = seg(t, .2, .5) * (1 - seg(t, T.end - .3, T.end)); if (a <= 0) return;
  const day = nCandles(t), boom = bump(t, T.melt[0] + .05, .3);
  X.save(); X.globalAlpha = a; X.textAlign = 'center'; const col = hot ? GOLD : '#BFE6FF';
  X.shadowColor = col; X.shadowBlur = 10 + 50 * boom; X.fillStyle = col; X.font = `${Math.round(150 * (1 + .15 * boom))}px IB`; X.fillText(shown + '°F', W / 2, 640);
  X.shadowBlur = 0; X.fillStyle = 'rgba(200,210,220,.8)'; X.font = '28px MO'; X.letterSpacing = '10px'; X.fillText(hot ? 'MELTING POINT' : day ? `DAY ${day}` : 'ICE', W / 2 + 5, 700);
  X.restore();
}
function caption(t) {
  for (const [a, b, txt, hi, hc] of T.texts) {
    if (t < a || t > b) continue;
    const al = Math.min(seg(t, a, a + .25), 1 - seg(t, b - .2, b));
    X.save(); X.globalAlpha = al; X.font = '46px MO'; X.letterSpacing = '4px'; X.textBaseline = 'middle';
    const lines = txt.split('\n'), cy = t >= T.end ? 880 : 380, y0 = cy - (lines.length - 1) * 33 + (1 - eout(seg(t, a, a + .35))) * 14;
    lines.forEach((ln, li) => { let x = W / 2 - X.measureText(ln).width / 2, y = y0 + li * 66, i = ln.indexOf(hi);
      const parts = i < 0 ? [[ln, WHITE]] : [[ln.slice(0, i), WHITE], [hi, hc === 'red' ? RED : GOLD], [ln.slice(i + hi.length), WHITE]];
      for (const [p, c] of parts) { if (!p) continue; X.fillStyle = c; X.shadowColor = c === WHITE ? 'rgba(0,0,0,.6)' : c; X.shadowBlur = c === WHITE ? 8 : 18; X.fillText(p, x, y); x += X.measureText(p).width; } });
    X.restore();
  }
}

window.draw = function (t) {
  X.setTransform(1, 0, 0, 1, 0, 0); X.globalAlpha = 1; X.globalCompositeOperation = 'source-over'; X.fillStyle = '#000'; X.fillRect(0, 0, W, H);
  const warm = clamp(nCandles(t) / 7 * .6 + .4 * seg(t, T.melt[0], T.melt[0] + 1)), endA = seg(t, T.end, T.end + .5);
  const z = 1.32 + .08 * seg(t, 0, T.melt[0]) - .04 * eout(seg(t, T.melt[0], T.melt[0] + 1.5)), sh = bump(t, T.melt[0] + .05, .2) * 10;
  X.save(); X.translate(590, 1330); X.scale(z, z); X.translate(-590 + Math.sin(t * 90) * sh, -1330);
  bg(t, warm);
  // əks (buz + şamlar)
  X.save(); X.translate(0, 2 * G); X.scale(1, -1); X.globalAlpha = .18; pedestal(); ice(t); X.restore();
  let rf = X.createLinearGradient(0, G, 0, G + 320); rf.addColorStop(0, 'rgba(2,2,3,0)'); rf.addColorStop(1, 'rgba(2,2,3,1)'); X.fillStyle = rf; X.fillRect(0, G, W, 320);
  pedestal(); ice(t); thermo(t);
  // fiqur: hər şamda əyilir; «quit» anında başını aşağı salır; əriyəndə qollar yuxarı
  let bend = 0; T.steps.slice(0, 7).forEach(([a]) => { bend = Math.max(bend, bump(t, a - .15, .22)); });
  const quit = seg(t, 6.7, 7.1) * (1 - seg(t, 9.9, 10.4)), joy = seg(t, T.melt[0] + .2, T.melt[0] + .7);
  const n = nCandles(t), next = CANDLE(Math.min(6, n));
  figure({ x: 310, base: G + 20, sc: 1, crouch: bend * .9, lean: bend * .5, down: .3 + .7 * quit - .3 * joy, look: .7 * (1 - quit),
    hr: joy > 0 ? [310 + 60, G - 420 + Math.sin(t * 6) * 10] : bend > .05 ? [lerp(290, next[0], bend), lerp(G - 120, next[1] - 40, bend)] : null,
    hl: joy > 0 ? [310 - 60, G - 420 + Math.cos(t * 6) * 10] : null, smile: joy });
  for (let i = 0; i < 7; i++) if (i < n) candle(i, t, T.steps[i][0]);
  X.restore();
  if (endA > 0) { X.fillStyle = `rgba(0,0,0,${.7 * endA})`; X.fillRect(0, 0, W, H); }
  const fl = bump(t, T.melt[0] + .02, .08) * .3; if (fl > .01) { X.fillStyle = `rgba(255,230,180,${fl})`; X.fillRect(0, 0, W, H); }
  let vg = X.createRadialGradient(540, 1000, 480, 540, 1000, 1250); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.6)'); X.fillStyle = vg; X.fillRect(0, 0, W, H);
  counter(t); caption(t);
  if (t >= T.end) { const a = seg(t, T.end + .5, T.end + 1); X.save(); X.globalAlpha = a; X.fillStyle = 'rgba(210,204,190,.9)'; X.font = '32px MO'; X.letterSpacing = '6px'; X.textAlign = 'center'; X.fillText('@constara.app', W / 2 + 3, 1120); X.restore(); }
};
document.fonts.ready.then(() => { window.READY = true; });
['MO', 'IB'].forEach(f => document.fonts.load('40px ' + f));
</script></body></html>
