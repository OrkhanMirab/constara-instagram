<script>

  // ---- personajlar (Open Peeps siluet, arxadan işıq) ----

  put('figN', 'SitOneLeg', 'rimC', 330, 120, 560);
  put('figP', 'SitHandsBack', 'rimW', 340, 110, 560);
  put('figR', 'Walking', 'rimO', 92, 318, 520);

  // ---- loqo ----
  var LOGO = '<g transform="rotate(-6)"><rect x="-95" y="-95" width="190" height="190" rx="44" fill="none" stroke="#FF6B35" stroke-width="14" transform="rotate(12)"/><path d="M-118 6h52l34-92 64 184 34-92h52" fill="none" stroke="#FF6B35" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/></g>';
  $('logo').innerHTML = '<g id="logoS">' + LOGO + '</g><text y="200" text-anchor="middle" font-family="Inter Tight" font-weight="900" font-size="62" letter-spacing="10" fill="#FF6B35">' + TL.brand + '</text>';
  $('brandmark').innerHTML = '<g transform="translate(78 372) scale(.12)">' + LOGO + '</g><text x="100" y="378" font-family="Inter Tight" font-weight="900" font-size="14" letter-spacing="3.5" fill="#93A1B2">' + TL.brand + '</text>';

  // ---- qrafik məlumatı (30 gün: qalxış → −5 → bərpa → yeni zirvə) ----

  var oldHigh = Math.max.apply(null, S.slice(0, DS)), dCross = DS; while (dCross < DX && S[dCross] <= oldHigh) dCross++;
  var cx0 = 66, cx1 = 474, cy0 = 690, cy1 = 420, smin = Math.min.apply(null, S), smax = Math.max.apply(null, S);
  var X = function (dd) { return cx0 + (cx1 - cx0) * dd / DX; }, Y = function (s) { return cy0 - (cy0 - cy1) * (s - smin + 1) / (smax - smin + 2); };
  var grid = ''; for (var gi = 0; gi < 6; gi++) grid += '<line x1="56" x2="484" y1="' + (cy1 - 20 + gi * 58) + '" y2="' + (cy1 - 20 + gi * 58) + '" stroke="#fff" stroke-opacity=".06"/>';
  for (gi = 0; gi < 7; gi++) grid += '<line y1="' + (cy1 - 30) + '" y2="' + (cy0 + 20) + '" x1="' + (66 + gi * 68) + '" x2="' + (66 + gi * 68) + '" stroke="#fff" stroke-opacity=".035"/>';

    $('chipP').setAttribute('opacity', pc); $('chipP').setAttribute('transform', 'translate(' + X(9) + ' ' + (Y(S[9]) - 40 - 10 * (1 - oc(P(t, G0 + .5, .3)))) + ') scale(' + lerp(.6, 1, ob(P(t, G0 + .5, .3))) + ')');

    var pn = P(t, tPeak, .3); $('nhigh').setAttribute('opacity', pn);

    $('spark').innerHTML = sp;
  }

    return l.chunks.map(function (ch) {

  // ---- fon: kətan ----
