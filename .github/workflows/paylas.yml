name: Instagram paylas

on:
  schedule:
    - cron: "7,37 * * * *"   # dovreni yeniden baslatmaq ucun; isleyen run varsa novbede gozleyir
  push:
    branches: [main]
    paths: ["queue/**", "sil/**", "plan/**"]
  workflow_dispatch:

concurrency:
  group: instagram-paylas
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  paylas:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Generator paketleri (Pillow, ffmpeg)
        run: pip install --quiet pillow imageio-ffmpeg

      # GitHub cron etibarsizdir (saatlarla run gelmir). Ona gore bir run ~5,5 saat dovrede isleyir,
      # her 2 deqiqeden bir plan/queue yoxlayir; cron yalniz dovreni yeniden baslatmaq ucundur.
      - name: Dovre - plan + novbe + silme
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          LOOP_MIN: "330"
        run: |
          git config user.name "constara-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          end=$((SECONDS + LOOP_MIN * 60))
          while :; do
            git pull -q --rebase origin main || git rebase --abort || true
            python3 sil.py || true
            python3 paylas.py || true
            git add -A
            if ! git diff --cached --quiet; then
              git commit -q -m "bot: paylasma neticesi"
              for i in 1 2 3; do
                git pull -q --rebase origin main && git push -q origin HEAD:main && break
                sleep 5
              done
            fi
            [ $SECONDS -ge $end ] && break
            sleep 120
          done
